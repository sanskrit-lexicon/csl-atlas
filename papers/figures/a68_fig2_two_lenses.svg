<svg xmlns='http://www.w3.org/2000/svg' width='760' height='340' viewBox='0 0 760 340'>
<title>DCS coverage of the PD canon under three metrics</title>
<rect width='760' height='340' fill='white'/>
<text x='30' y='30' font-family='Georgia, serif' font-size='15' font-weight='bold'>DCS coverage of the PD source canon — three lenses, one corpus</text>
<line x1='60' y1='250.0' x2='740' y2='250.0' stroke='#dddddd'/>
<text x='52' y='254.0' font-family='Georgia, serif' font-size='11' text-anchor='end'>0 %</text>
<line x1='60' y1='200.0' x2='740' y2='200.0' stroke='#dddddd'/>
<text x='52' y='204.0' font-family='Georgia, serif' font-size='11' text-anchor='end'>25 %</text>
<line x1='60' y1='150.0' x2='740' y2='150.0' stroke='#dddddd'/>
<text x='52' y='154.0' font-family='Georgia, serif' font-size='11' text-anchor='end'>50 %</text>
<line x1='60' y1='100.0' x2='740' y2='100.0' stroke='#dddddd'/>
<text x='52' y='104.0' font-family='Georgia, serif' font-size='11' text-anchor='end'>75 %</text>
<line x1='60' y1='50.0' x2='740' y2='50.0' stroke='#dddddd'/>
<text x='52' y='54.0' font-family='Georgia, serif' font-size='11' text-anchor='end'>100 %</text>
<rect x='80' y='240.3' width='140' height='9.7' fill='#92c5de'/>
<text x='150.0' y='234.3' font-family='Georgia, serif' font-size='14' font-weight='bold' text-anchor='middle'>4.8 %</text>
<text x='150.0' y='268' font-family='Georgia, serif' font-size='11' text-anchor='middle'>Title-level</text>
<text x='150.0' y='282' font-family='Georgia, serif' font-size='11' text-anchor='middle'>(118 of ~2,445 works)</text>
<rect x='250' y='199.7' width='140' height='50.3' fill='#2166ac'/>
<text x='320.0' y='193.7' font-family='Georgia, serif' font-size='14' font-weight='bold' text-anchor='middle'>25.2 %</text>
<text x='320.0' y='268' font-family='Georgia, serif' font-size='11' text-anchor='middle'>PD-citation-weighted</text>
<text x='320.0' y='282' font-family='Georgia, serif' font-size='11' text-anchor='middle'>(of what PD cites)</text>
<rect x='420' y='101.9' width='140' height='148.1' fill='#92c5de'/>
<text x='490.0' y='95.9' font-family='Georgia, serif' font-size='14' font-weight='bold' text-anchor='middle'>74.1 %</text>
<text x='490.0' y='268' font-family='Georgia, serif' font-size='11' text-anchor='middle'>DCS-token-weighted 2021</text>
<text x='490.0' y='282' font-family='Georgia, serif' font-size='11' text-anchor='middle'>(of DCS's own mass)</text>
<rect x='590' y='94.2' width='140' height='155.8' fill='#2166ac'/>
<text x='660.0' y='88.2' font-family='Georgia, serif' font-size='14' font-weight='bold' text-anchor='middle'>77.9 %</text>
<text x='660.0' y='268' font-family='Georgia, serif' font-size='11' text-anchor='middle'>DCS-token-weighted 2026</text>
<text x='660.0' y='282' font-family='Georgia, serif' font-size='11' text-anchor='middle'>(of DCS's own mass)</text>
</svg>
