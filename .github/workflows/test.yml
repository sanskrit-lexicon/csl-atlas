name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Pin npm
        run: npm install --global npm@10.8.2
      - name: Install dependencies
        run: npm ci
      - name: Production verification
        run: npm run verify
